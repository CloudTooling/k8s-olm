# This is a basic workflow to help you get started with Actions

name: Test OLM Chart

on:
  workflow_dispatch:
  merge_group:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop ]

jobs:
  end2end:
    name: 'Build and Test Helm Chart'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.11.2

      - uses: gabe565/setup-helm-docs-action@v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          check-latest: true

      # Runs commands using the runners shell
      - name: Check for updates in chart
        run: .bin/update-chart.sh

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            chart:
              - 'chart/**'

      # push the change if exists
      - uses: int128/update-generated-files-action@v2
        with:
          commit-message: "chore: Update OLM chart"
        if: steps.changes.outputs.chart == 'true'

      - name: Helm Chart Testing
        uses: helm/chart-testing-action@v2.7.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --target-branch ${{ github.event.repository.default_branch }}

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1.12.0

      - name: Run chart-testing (install - no further args)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --target-branch ${{ github.event.repository.default_branch }}

      - name: Run chart-testing (install - with args)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --target-branch ${{ github.event.repository.default_branch }} --helm-extra-set-args "-f chart/ci.values.yaml"
